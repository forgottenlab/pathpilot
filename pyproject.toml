[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathpilot"
version = "0.2.1"
description = "PathPilot - Downloads and installation path governance assistant."
requires-python = ">=3.12"
dependencies = [
    "watchdog==6.0.0",
    "psutil==7.0.0",
    "PySide6==6.8.2",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "questionary>=2.0.0"
]

[project.scripts]
pathpilot = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

