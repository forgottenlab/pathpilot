name: Windows CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PATHPILOT_HOME: ${{ runner.temp }}\pathpilot-home

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and pytest
        run: |
          python -m pip install -e .
          python -m pip install "pytest>=8,<9"

      - name: Run pytest in temporary state
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp "${{ runner.temp }}\pytest-${{ matrix.python-version }}"

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Verify CLI help
        run: |
          pathpilot --help
          pathpilot installs --help
          pathpilot installs run --help

      - name: Check whitespace
        run: git diff --check HEAD
